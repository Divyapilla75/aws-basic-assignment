AWSTemplateFormatVersion: '2010-09-09'



Description: >

  CloudFormation infrastructure for a scalable web application using

  Amazon ECS Fargate, Application Load Balancer, Amazon RDS PostgreSQL,

  Amazon ECR, Auto Scaling, CloudWatch and SNS.



Parameters:



  EnvironmentName:

    Type: String

    Default: cfn

    Description: Environment name used for resource naming and tagging.




  EcsCpu:

    Type: String

    Default: '256'

    AllowedValues:

      - '256'

      - '512'

      - '1024'

    Description: ECS task CPU units.



  EcsMemory:

    Type: String

    Default: '512'

    AllowedValues:

      - '512'

      - '1024'

      - '2048'

    Description: ECS task memory in MiB.



  DesiredTaskCount:

    Type: Number

    Default: 0

    MinValue: 0

    MaxValue: 3

    Description: Initial number of ECS tasks.



  MaxTaskCount:

    Type: Number

    Default: 3

    MinValue: 1

    MaxValue: 10

    Description: Maximum number of ECS tasks.



  RdsInstanceClass:

    Type: String

    Default: db.t3.micro

    Description: RDS PostgreSQL instance class.



  RdsBackupRetention:

    Type: Number

    Default: 1

    MinValue: 1

    MaxValue: 35

    Description: Automated backup retention period in days.



  DBPassword:

    Type: String

    NoEcho: true

    MinLength: 8

    Description: PostgreSQL master password.




  GitHubConnectionArn:
    Type: String
    Default: ''
    Description: AWS CodeConnections ARN for the GitHub source.

  GitHubFullRepositoryId:
    Type: String
    Default: ''
    Description: GitHub repository in owner/repository format.

  GitHubBranch:
    Type: String
    Default: main
    Description: GitHub branch used by CodePipeline.

  ArtifactBucketName:
    Type: String
    Default: ''
    Description: Optional name for the S3 artifact bucket. Leave blank for a CloudFormation-generated name.

  MinTaskCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
    Description: Minimum ECS task count for Service Auto Scaling.

  AlarmEmail:
    Type: String
    Default: ''
    Description: Email address for SNS alarm notifications. Leave blank to skip the subscription.

Conditions:
  HasGitHubConnection: !And
    - !Not [!Equals [!Ref GitHubConnectionArn, '']]
    - !Not [!Equals [!Ref GitHubFullRepositoryId, '']]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasArtifactBucketName: !Not [!Equals [!Ref ArtifactBucketName, '']]

Resources:



  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-vpc
        - Key: Project
          Value: aws-scalable-web-app
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-private-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-nat-eip

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicSubnet1RouteTableAssociation
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-nat

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub aws-scalable-web-app-${EnvironmentName}-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  EcrRepository:

    Type: AWS::ECR::Repository

    Properties:

      RepositoryName: !Sub aws-scalable-web-app-${EnvironmentName}

      ImageScanningConfiguration:

        ScanOnPush: true

      Tags:

        - Key: Project

          Value: aws-scalable-web-app

        - Key: Environment

          Value: !Ref EnvironmentName



  EcsCluster:

    Type: AWS::ECS::Cluster

    Properties:

      ClusterName: !Sub aws-scalable-web-app-${EnvironmentName}

      ClusterSettings:

        - Name: containerInsights

          Value: enabled

      Tags:

        - Key: Project

          Value: aws-scalable-web-app

        - Key: Environment

          Value: !Ref EnvironmentName



  AlbSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Security group for Application Load Balancer

      VpcId: !Ref VPC

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 80

          ToPort: 80

          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name

          Value: !Sub aws-scalable-web-app-${EnvironmentName}-alb-sg



  EcsSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Security group for ECS Fargate tasks

      VpcId: !Ref VPC

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 5000

          ToPort: 5000

          SourceSecurityGroupId: !Ref AlbSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name

          Value: !Sub aws-scalable-web-app-${EnvironmentName}-ecs-sg



  RdsSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription: Security group for RDS PostgreSQL

      VpcId: !Ref VPC

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 5432

          ToPort: 5432

          SourceSecurityGroupId: !Ref EcsSecurityGroup

      SecurityGroupEgress:

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name

          Value: !Sub aws-scalable-web-app-${EnvironmentName}-rds-sg



  Alb:

    Type: AWS::ElasticLoadBalancingV2::LoadBalancer

    Properties:

      Name: !Sub aws-scalable-web-app-${EnvironmentName}-alb

      Scheme: internet-facing

      Type: application

      SecurityGroups:

        - !Ref AlbSecurityGroup

      Subnets:

        - !Ref PublicSubnet1

        - !Ref PublicSubnet2

      Tags:

        - Key: Project

          Value: aws-scalable-web-app

        - Key: Environment

          Value: !Ref EnvironmentName



  TargetGroup:

    Type: AWS::ElasticLoadBalancingV2::TargetGroup

    Properties:

      Name: !Sub aws-scalable-web-app-${EnvironmentName}-tg

      Port: 5000

      Protocol: HTTP

      TargetType: ip

      VpcId: !Ref VPC

      HealthCheckEnabled: true

      HealthCheckPath: /health

      HealthCheckProtocol: HTTP

      HealthCheckPort: traffic-port

      HealthCheckIntervalSeconds: 30

      HealthCheckTimeoutSeconds: 5

      HealthyThresholdCount: 2

      UnhealthyThresholdCount: 3

      Matcher:

        HttpCode: '200'



  AlbListener:

    Type: AWS::ElasticLoadBalancingV2::Listener

    Properties:

      LoadBalancerArn: !Ref Alb

      Port: 80

      Protocol: HTTP

      DefaultActions:

        - Type: forward

          TargetGroupArn: !Ref TargetGroup



  LogGroup:

    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName: !Sub /ecs/aws-scalable-web-app-${EnvironmentName}

      RetentionInDays: 7

      Tags:

        - Key: Project

          Value: aws-scalable-web-app

        - Key: Environment

          Value: !Ref EnvironmentName



  TaskDefinition:

    Type: AWS::ECS::TaskDefinition

    Properties:

      Family: !Sub aws-scalable-web-app-${EnvironmentName}

      NetworkMode: awsvpc

      RequiresCompatibilities:

        - FARGATE

      Cpu: !Ref EcsCpu

      Memory: !Ref EcsMemory

      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn

      ContainerDefinitions:

        - Name: aws-web-app

          Image: !Sub ${EcrRepository.RepositoryUri}:latest

          Essential: true

          PortMappings:

            - ContainerPort: 5000

              HostPort: 5000

              Protocol: tcp

          HealthCheck:

            Command:

              - CMD-SHELL

              - >-

                python -c "import urllib.request;

                urllib.request.urlopen('http://localhost:5000/health')"

                || exit 1

            Interval: 30

            Timeout: 5

            Retries: 3

            StartPeriod: 10

          LogConfiguration:

            LogDriver: awslogs

            Options:

              awslogs-group: !Ref LogGroup

              awslogs-region: !Ref AWS::Region

              awslogs-stream-prefix: ecs



  EcsService:

    Type: AWS::ECS::Service

    DependsOn:

      - AlbListener

    Properties:

      ServiceName: !Sub aws-scalable-web-app-${EnvironmentName}-service

      Cluster: !Ref EcsCluster

      LaunchType: FARGATE

      DesiredCount: !Ref DesiredTaskCount

      TaskDefinition: !Ref TaskDefinition

      HealthCheckGracePeriodSeconds: 60

      NetworkConfiguration:

        AwsvpcConfiguration:

          AssignPublicIp: DISABLED

          SecurityGroups:

            - !Ref EcsSecurityGroup

          Subnets:

            - !Ref PrivateSubnet1

            - !Ref PrivateSubnet2

      LoadBalancers:

        - ContainerName: aws-web-app

          ContainerPort: 5000

          TargetGroupArn: !Ref TargetGroup

      DeploymentConfiguration:

        MaximumPercent: 200

        MinimumHealthyPercent: 100



  ScalableTarget:

    Type: AWS::ApplicationAutoScaling::ScalableTarget

    DependsOn:

      - EcsService

    Properties:

      MinCapacity: !Ref MinTaskCount

      MaxCapacity: !Ref MaxTaskCount

      ResourceId: !Sub service/${EcsCluster}/${EcsService.Name}

      ScalableDimension: ecs:service:DesiredCount

      ServiceNamespace: ecs



  ScalingPolicy:

    Type: AWS::ApplicationAutoScaling::ScalingPolicy

    Properties:

      PolicyName: !Sub aws-scalable-web-app-${EnvironmentName}-cpu-scaling

      PolicyType: TargetTrackingScaling

      ScalingTargetId: !Ref ScalableTarget

      TargetTrackingScalingPolicyConfiguration:

        TargetValue: 60

        PredefinedMetricSpecification:

          PredefinedMetricType: ECSServiceAverageCPUUtilization

        ScaleInCooldown: 60

        ScaleOutCooldown: 60



  RdsSubnetGroup:

    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: Private subnet group for PostgreSQL

      DBSubnetGroupName: !Sub aws-scalable-web-app-${EnvironmentName}-db-subnet

      SubnetIds:

        - !Ref PrivateSubnet1

        - !Ref PrivateSubnet2

      Tags:

        - Key: Project

          Value: aws-scalable-web-app

        - Key: Environment

          Value: !Ref EnvironmentName



  RdsInstance:

    Type: AWS::RDS::DBInstance

    Properties:

      DBInstanceIdentifier: !Sub aws-scalable-web-app-${EnvironmentName}-db

      Engine: postgres

      DBInstanceClass: !Ref RdsInstanceClass

      AllocatedStorage: 20

      StorageType: gp3

      StorageEncrypted: true

      DBName: appdb

      MasterUsername: postgres

      MasterUserPassword: !Ref DBPassword

      BackupRetentionPeriod: !Ref RdsBackupRetention

      PubliclyAccessible: false

      MultiAZ: false

      DBSubnetGroupName: !Ref RdsSubnetGroup

      VPCSecurityGroups:

        - !Ref RdsSecurityGroup

      DeletionProtection: false

      DeleteAutomatedBackups: true

      Tags:

        - Key: Project

          Value: aws-scalable-web-app

        - Key: Environment

          Value: !Ref EnvironmentName



  SnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub aws-scalable-web-app-${EnvironmentName}-alerts
      Tags:
        - Key: Project
          Value: aws-scalable-web-app
        - Key: Environment
          Value: !Ref EnvironmentName

  SnsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref SnsTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If [HasArtifactBucketName, !Ref ArtifactBucketName, !Ref AWS::NoValue]
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub aws-scalable-web-app-${EnvironmentName}-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ECR_REPOSITORY_URI
            Value: !GetAtt EcrRepository.RepositoryUri

  CodePipelineRole:
    Type: AWS::IAM::Role
    Condition: HasGitHubConnection
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt CodeBuildProject.Arn
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt EcsTaskExecutionRole.Arn
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnectionArn

  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Condition: HasGitHubConnection
    Properties:
      Name: !Sub aws-scalable-web-app-${EnvironmentName}-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Ref GitHubFullRepositoryId
                BranchName: !Ref GitHubBranch
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BuildAndPush
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: Deploy
          Actions:
            - Name: DeployToECS
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: '1'
              Configuration:
                ClusterName: !Ref EcsCluster
                ServiceName: !GetAtt EcsService.Name
                FileName: imagedefinitions.json
              InputArtifacts:
                - Name: BuildOutput

  EcsHighCpuAlarm:

    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: !Sub aws-scalable-web-app-${EnvironmentName}-ecs-high-cpu

      AlarmDescription: ECS service CPU utilization is high.

      Namespace: AWS/ECS

      MetricName: CPUUtilization

      Dimensions:

        - Name: ClusterName

          Value: !Ref EcsCluster

        - Name: ServiceName

          Value: !GetAtt EcsService.Name

      Statistic: Average

      Period: 300

      EvaluationPeriods: 2

      Threshold: 70

      ComparisonOperator: GreaterThanThreshold

      TreatMissingData: notBreaching

      AlarmActions:

        - !Ref SnsTopic



  RdsHighCpuAlarm:

    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: !Sub aws-scalable-web-app-${EnvironmentName}-rds-high-cpu

      AlarmDescription: RDS CPU utilization is high.

      Namespace: AWS/RDS

      MetricName: CPUUtilization

      Dimensions:

        - Name: DBInstanceIdentifier

          Value: !Ref RdsInstance

      Statistic: Average

      Period: 300

      EvaluationPeriods: 2

      Threshold: 70

      ComparisonOperator: GreaterThanThreshold

      TreatMissingData: notBreaching

      AlarmActions:

        - !Ref SnsTopic



  AlbHighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aws-scalable-web-app-${EnvironmentName}-alb-high-latency
      AlarmDescription: ALB target response time is high.
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SnsTopic

  AlbHighRequestCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aws-scalable-web-app-${EnvironmentName}-alb-high-request-count
      AlarmDescription: ALB request count is high.
      Namespace: AWS/ApplicationELB
      MetricName: RequestCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SnsTopic

  Alb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aws-scalable-web-app-${EnvironmentName}-alb-5xx
      AlarmDescription: ALB is returning 5XX errors.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt Alb.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SnsTopic

  RdsHighConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aws-scalable-web-app-${EnvironmentName}-rds-high-connections
      AlarmDescription: RDS database connections are high.
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RdsInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SnsTopic

  ApplicationDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub aws-scalable-web-app-${EnvironmentName}-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "ECS CPU Utilization",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Average",
                "period": 300,
                "metrics": [["AWS/ECS","CPUUtilization","ClusterName","${EcsCluster}","ServiceName","${EcsService}"]]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "ECS Memory Utilization",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Average",
                "period": 300,
                "metrics": [["AWS/ECS","MemoryUtilization","ClusterName","${EcsCluster}","ServiceName","${EcsService}"]]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Latency",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Average",
                "period": 300,
                "metrics": [["AWS/ApplicationELB","TargetResponseTime","LoadBalancer","${Alb.LoadBalancerFullName}"]]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Requests and 5XX",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "metrics": [
                  ["AWS/ApplicationELB","RequestCount","LoadBalancer","${Alb.LoadBalancerFullName}"],
                  [".","HTTPCode_ELB_5XX_Count",".","${Alb.LoadBalancerFullName}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "RDS CPU Utilization",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Average",
                "period": 300,
                "metrics": [["AWS/RDS","CPUUtilization","DBInstanceIdentifier","${RdsInstance}"]]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "RDS Database Connections",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Average",
                "period": 300,
                "metrics": [["AWS/RDS","DatabaseConnections","DBInstanceIdentifier","${RdsInstance}"]]
              }
            }
          ]
        }

  ApplicationLogsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub aws-scalable-web-app-${EnvironmentName}-recent-logs
      LogGroupNames:
        - !Ref LogGroup
      QueryString: |
        fields @timestamp, @message
        | sort @timestamp desc
        | limit 50


Outputs:



  EcrRepositoryUri:

    Description: CloudFormation-managed ECR repository URI

    Value: !GetAtt EcrRepository.RepositoryUri



  EcsClusterName:

    Description: ECS cluster name

    Value: !Ref EcsCluster



  EcsServiceName:

    Description: ECS service name

    Value: !GetAtt EcsService.Name



  AlbDnsName:

    Description: Application Load Balancer DNS name

    Value: !GetAtt Alb.DNSName



  RdsEndpoint:

    Description: PostgreSQL endpoint

    Value: !GetAtt RdsInstance.Endpoint.Address



  SnsTopicArn:
    Description: SNS topic ARN for CloudWatch alarm notifications
    Value: !Ref SnsTopic

  ArtifactBucketName:
    Description: Versioned S3 artifact bucket
    Value: !Ref ArtifactBucket

  RdsPort:

    Description: PostgreSQL port

    Value: !GetAtt RdsInstance.Endpoint.Port