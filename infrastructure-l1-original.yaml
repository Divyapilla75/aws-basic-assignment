AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudFormation infrastructure for a scalable web application using
  Amazon ECS Fargate, Application Load Balancer, Amazon RDS PostgreSQL,
  Amazon ECR, Auto Scaling, CloudWatch and SNS.

Parameters:

  EnvironmentName:
    Type: String
    Default: cfn
    Description: Environment name used for resource naming and tagging.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0a05780878988758b
    Description: Existing VPC for the application.

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-03f73679aadeb48a9
    Description: First public subnet for the ALB.

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-01db4f74a9e89b47a
    Description: Second public subnet for the ALB.

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0160380fce3d8a5e1
    Description: First private subnet for ECS and RDS.

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0e2ba92a64b8b200f
    Description: Second private subnet for ECS and RDS.

  EcsCpu:
    Type: String
    Default: '256'
    AllowedValues:
      - '256'
      - '512'
      - '1024'
    Description: ECS task CPU units.

  EcsMemory:
    Type: String
    Default: '512'
    AllowedValues:
      - '512'
      - '1024'
      - '2048'
    Description: ECS task memory in MiB.

  DesiredTaskCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 3
    Description: Initial number of ECS tasks.

  MaxTaskCount:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
    Description: Maximum number of ECS tasks.

  RdsInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS PostgreSQL instance class.

  RdsBackupRetention:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 35
    Description: Automated backup retention period in days.

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: PostgreSQL master password.

  EcsTaskExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::064713308785:role/ecsTaskExecutionRole
    Description: ECS task execution IAM role ARN.

  SnsTopicArn:
    Type: String
    Default: arn:aws:sns:us-east-1:064713308785:aws-scalable-web-app-alerts
    Description: Existing SNS topic used for CloudWatch alarms.

Resources:

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub aws-scalable-web-app-${EnvironmentName}
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
        - Key: Project
          Value: aws-scalable-web-app
        - Key: Environment
          Value: !Ref EnvironmentName

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub aws-scalable-web-app-${EnvironmentName}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: aws-scalable-web-app
        - Key: Environment
          Value: !Ref EnvironmentName

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-alb-sg

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS Fargate tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-ecs-sg

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EcsSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub aws-scalable-web-app-${EnvironmentName}-rds-sg

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub aws-scalable-web-app-${EnvironmentName}-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - Key: Project
          Value: aws-scalable-web-app
        - Key: Environment
          Value: !Ref EnvironmentName

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub aws-scalable-web-app-${EnvironmentName}-tg
      Port: 5000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/aws-scalable-web-app-${EnvironmentName}
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: aws-scalable-web-app
        - Key: Environment
          Value: !Ref EnvironmentName

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aws-scalable-web-app-${EnvironmentName}
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref EcsCpu
      Memory: !Ref EcsMemory
      ExecutionRoleArn: !Ref EcsTaskExecutionRoleArn
      ContainerDefinitions:
        - Name: aws-web-app
          Image: !Sub ${EcrRepository.RepositoryUri}:latest
          Essential: true
          PortMappings:
            - ContainerPort: 5000
              HostPort: 5000
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - >-
                python -c "import urllib.request;
                urllib.request.urlopen('http://localhost:5000/health')"
                || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  EcsService:
    Type: AWS::ECS::Service
    DependsOn:
      - AlbListener
    Properties:
      ServiceName: !Sub aws-scalable-web-app-${EnvironmentName}-service
      Cluster: !Ref EcsCluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredTaskCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref EcsSecurityGroup
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
      LoadBalancers:
        - ContainerName: aws-web-app
          ContainerPort: 5000
          TargetGroupArn: !Ref TargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn:
      - EcsService
    Properties:
      MinCapacity: 1
      MaxCapacity: !Ref MaxTaskCount
      ResourceId: !Sub service/${EcsCluster}/${EcsService.Name}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub aws-scalable-web-app-${EnvironmentName}-cpu-scaling
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnet group for PostgreSQL
      DBSubnetGroupName: !Sub aws-scalable-web-app-${EnvironmentName}-db-subnet
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Project
          Value: aws-scalable-web-app
        - Key: Environment
          Value: !Ref EnvironmentName

  RdsInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub aws-scalable-web-app-${EnvironmentName}-db
      Engine: postgres
      DBInstanceClass: !Ref RdsInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: appdb
      MasterUsername: postgres
      MasterUserPassword: !Ref DBPassword
      BackupRetentionPeriod: !Ref RdsBackupRetention
      PubliclyAccessible: false
      MultiAZ: false
      DBSubnetGroupName: !Ref RdsSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      DeletionProtection: false
      DeleteAutomatedBackups: true
      Tags:
        - Key: Project
          Value: aws-scalable-web-app
        - Key: Environment
          Value: !Ref EnvironmentName

  EcsHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aws-scalable-web-app-${EnvironmentName}-ecs-high-cpu
      AlarmDescription: ECS service CPU utilization is high.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref EcsCluster
        - Name: ServiceName
          Value: !GetAtt EcsService.Name
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SnsTopicArn

  RdsHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aws-scalable-web-app-${EnvironmentName}-rds-high-cpu
      AlarmDescription: RDS CPU utilization is high.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RdsInstance
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SnsTopicArn

Outputs:

  EcrRepositoryUri:
    Description: CloudFormation-managed ECR repository URI
    Value: !GetAtt EcrRepository.RepositoryUri

  EcsClusterName:
    Description: ECS cluster name
    Value: !Ref EcsCluster

  EcsServiceName:
    Description: ECS service name
    Value: !GetAtt EcsService.Name

  AlbDnsName:
    Description: Application Load Balancer DNS name
    Value: !GetAtt Alb.DNSName

  RdsEndpoint:
    Description: PostgreSQL endpoint
    Value: !GetAtt RdsInstance.Endpoint.Address

  RdsPort:
    Description: PostgreSQL port
    Value: !GetAtt RdsInstance.Endpoint.Port